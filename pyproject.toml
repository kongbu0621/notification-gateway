[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "notification-gateway"
version = "0.1.0"
description = "A durable, provider-neutral notification delivery gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "notification-gateway contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema[format]>=4.23",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
notification-gateway = "notification_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/notification-request-v1.json" = "notification_gateway/schemas/notification-request-v1.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/schemas",
  "/tests",
  "/docs",
  "/README.md",
  "/README.zh-CN.md",
  "/AGENTS.md",
  "/AGENTS.zh-CN.md",
  "/SECURITY.md",
  "/SECURITY.zh-CN.md",
  "/LICENSE",
  "/.env.example",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=notification_gateway --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["notification_gateway"]
